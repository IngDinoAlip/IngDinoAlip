  <text x="56" y="234" font-family="Consolas, Menlo, monospace" font-size="16" fill="#7DD3FC">software · fabricación digital · automatización · STEM<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
